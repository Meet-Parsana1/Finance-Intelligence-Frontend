<!doctype html>
<html lang="en">
      <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Reset Password | Finance Intelligence</title>
            <link rel="preconnect" href="https://fonts.googleapis.com" />
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
            <link
                  href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
                  rel="stylesheet"
            />
            <link rel="stylesheet" href="CSS/auth-recovery.css" />
      </head>
      <body class="recovery-page">
            <main class="recovery-shell recovery-shell--single">
                  <section class="recovery-panel recovery-panel--form">
                        <div class="recovery-head">
                              <p class="recovery-kicker">Secure Reset</p>
                              <h2>Create a new password</h2>
                              <p class="recovery-copy">Choose a strong password with at least 8 characters.</p>
                        </div>

                        <form id="resetPasswordForm" class="recovery-form">
                              <label class="recovery-label" for="newPassword">New Password</label>
                              <input type="password" id="newPassword" placeholder="Enter your new password" required />

                              <label class="recovery-label" for="confirmPassword">Confirm Password</label>
                              <input type="password" id="confirmPassword" placeholder="Confirm your new password" required />

                              <button type="submit" class="recovery-btn">Reset Password</button>
                        </form>

                        <div id="resetPasswordMessage" class="recovery-message" aria-live="polite"></div>
                        <a href="login.html" class="recovery-back-link recovery-back-link--inline">&larr; Back to login</a>
                  </section>
            </main>

            <script src="JS/reset-password.js"></script>
      </body>
</html>
