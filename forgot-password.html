<!doctype html>
<html lang="en">
      <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Forgot Password | Finance Intelligence</title>
            <link rel="preconnect" href="https://fonts.googleapis.com" />
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
            <link
                  href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
                  rel="stylesheet"
            />
            <link rel="stylesheet" href="CSS/auth-recovery.css" />
      </head>
      <body class="recovery-page">
            <main class="recovery-shell">
                  <section class="recovery-panel recovery-panel--info">
                        <span class="recovery-badge">Secure Recovery</span>
                        <h1>Reset your password without losing momentum.</h1>
                        <p>
                              Enter your email address and we will generate a time-limited reset link for your account.
                        </p>
                        <a href="login.html" class="recovery-back-link">&larr; Back to login</a>
                  </section>

                  <section class="recovery-panel recovery-panel--form">
                        <div class="recovery-head">
                              <p class="recovery-kicker">Password Recovery</p>
                              <h2>Forgot password</h2>
                              <p class="recovery-copy">We will verify your email and guide you to a secure reset.</p>
                        </div>

                        <form id="forgotPasswordForm" class="recovery-form">
                              <label class="recovery-label" for="recoveryEmail">Email Address</label>
                              <input type="email" id="recoveryEmail" placeholder="you@company.com" required />

                              <button type="submit" class="recovery-btn">Generate Reset Link</button>
                        </form>

                        <div id="forgotPasswordMessage" class="recovery-message" aria-live="polite"></div>
                  </section>
            </main>

            <script src="JS/forgot-password.js"></script>
      </body>
</html>
